name: Build VICBANGFIT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias
        run: npm install

      - name: Compilar web
        run: npm run build

      - name: Guardar configuración Firebase
        run: |
          cp android/app/google-services.json /tmp/google-services.json
          rm -rf android

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Restaurar Firebase
        run: |
          cp /tmp/google-services.json android/app/google-services.json

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Restaurar firma fija
        run: |
          mkdir -p "$HOME/.vicbangfit"
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > "$HOME/.vicbangfit/vicbangfit.keystore"

      - name: Compilar APK sin firma
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Firmar APK VICBANGFIT
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* | sort -V | tail -n 1)

          "$BUILD_TOOLS/zipalign" -f 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/VICBANGFIT-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HOME/.vicbangfit/vicbangfit.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out android/app/build/outputs/apk/release/VICBANGFIT.apk \
            android/app/build/outputs/apk/release/VICBANGFIT-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs \
            android/app/build/outputs/apk/release/VICBANGFIT.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VICBANGFIT-APK
          path: android/app/build/outputs/apk/release/VICBANGFIT.apk
      
        
          

    
        
      

  
        
          
  
    
    

      
      

