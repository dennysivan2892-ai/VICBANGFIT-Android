name: Build VICBANGFIT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias
        run: npm install

      - name: Compilar web
        run: npm run build

      - name: Guardar configuración Firebase
        run: |
          cp android/app/google-services.json /tmp/google-services.json
          rm -rf android

      - name: Crear proyecto Android
        run: npx cap add android
      - name: Poner logo 3D VICBANGFIT
        run: |
          for d in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            mkdir -p "$d"
            cp VICBANGFIT_logo_3D_512.png "$d/ic_launcher.png"
            cp VICBANGFIT_logo_3D_512.png "$d/ic_launcher_round.png"
            cp VICBANGFIT_logo_3D_512.png "$d/ic_launcher_foreground.png"
          done
      - name: Configurar enlace de recuperación VICBANGFIT
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          needle = """            </intent-filter>"""
          deep_link = """            </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.vicbangfit.app" android:host="auth-callback" />
                      </intent-filter>"""

          if 'android:host="auth-callback"' not in s:
              if needle not in s:
                  raise SystemExit("No se encontró el intent-filter de Android")
              s = s.replace(needle, deep_link, 1)
              p.write_text(s)
          PY
      - name: Restaurar Firebase
        run: |
          cp /tmp/google-services.json android/app/google-services.json

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Restaurar firma fija
        run: |
          mkdir -p "$HOME/.vicbangfit"
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > "$HOME/.vicbangfit/vicbangfit.keystore"

      - name: Compilar APK sin firma
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Firmar APK VICBANGFIT
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* | sort -V | tail -n 1)

          "$BUILD_TOOLS/zipalign" -f 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/VICBANGFIT-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HOME/.vicbangfit/vicbangfit.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out android/app/build/outputs/apk/release/VICBANGFIT.apk \
            android/app/build/outputs/apk/release/VICBANGFIT-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs \
            android/app/build/outputs/apk/release/VICBANGFIT.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VICBANGFIT-APK
          path: android/app/build/outputs/apk/release/VICBANGFIT.apk
      
        
          

    
        
      

  
        
          
  
    
    

      
      

