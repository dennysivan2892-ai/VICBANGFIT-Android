name: Build VICBANGFIT Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/build-vicbangfit-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Crear proyecto Electron temporal
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-build | Out-Null
          New-Item -ItemType Directory -Force -Path windows-build\app-web | Out-Null
          Copy-Item -Path web\* -Destination windows-build\app-web -Recurse -Force

          @'
          {
            "name": "vicbangfit-windows",
            "version": "1.0.0",
            "description": "VICBANGFIT para Windows",
            "main": "main.js",
            "author": "VICBANGFIT",
            "license": "UNLICENSED",
            "scripts": {
              "dist": "electron-builder --win nsis --x64"
            },
            "devDependencies": {
              "electron": "^37.2.6",
              "electron-builder": "^26.0.12"
            },
            "build": {
              "appId": "com.vicbangfit.windows",
              "productName": "VICBANGFIT",
              "asar": true,
              "directories": {
                "output": "dist"
              },
              "files": [
                "main.js",
                "app-web/**/*"
              ],
              "win": {
                "target": [
                  {
                    "target": "nsis",
                    "arch": ["x64"]
                  }
                ],
                "artifactName": "VICBANGFIT-Windows-Setup.exe"
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "shortcutName": "VICBANGFIT"
              }
            }
          }
          '@ | Set-Content -Path windows-build\package.json -Encoding UTF8

          @'
          const { app, BrowserWindow, shell } = require("electron");
          const http = require("http");
          const fs = require("fs");
          const path = require("path");

          let server;

          const MIME = {
            ".html": "text/html; charset=utf-8",
            ".js": "text/javascript; charset=utf-8",
            ".css": "text/css; charset=utf-8",
            ".json": "application/json; charset=utf-8",
            ".svg": "image/svg+xml",
            ".png": "image/png",
            ".jpg": "image/jpeg",
            ".jpeg": "image/jpeg",
            ".webp": "image/webp",
            ".ico": "image/x-icon",
            ".woff": "font/woff",
            ".woff2": "font/woff2"
          };

          function startLocalServer() {
            const root = path.join(__dirname, "app-web");

            return new Promise((resolve, reject) => {
              server = http.createServer((req, res) => {
                try {
                  let reqPath = decodeURIComponent((req.url || "/").split("?")[0]);
                  if (reqPath === "/") reqPath = "/index.html";

                  let filePath = path.normalize(path.join(root, reqPath));

                  if (!filePath.startsWith(path.normalize(root))) {
                    res.writeHead(403);
                    res.end("Forbidden");
                    return;
                  }

                  if (!fs.existsSync(filePath) || fs.statSync(filePath).isDirectory()) {
                    filePath = path.join(root, "index.html");
                  }

                  const ext = path.extname(filePath).toLowerCase();
                  res.writeHead(200, {
                    "Content-Type": MIME[ext] || "application/octet-stream",
                    "Cache-Control": "no-cache"
                  });

                  fs.createReadStream(filePath).pipe(res);
                } catch (err) {
                  res.writeHead(500);
                  res.end("Internal error");
                }
              });

              server.on("error", reject);
              server.listen(0, "127.0.0.1", () => {
                const port = server.address().port;
                resolve(`http://127.0.0.1:${port}/`);
              });
            });
          }

          async function createWindow() {
            const localUrl = await startLocalServer();

            const win = new BrowserWindow({
              width: 1280,
              height: 850,
              minWidth: 900,
              minHeight: 650,
              backgroundColor: "#070707",
              autoHideMenuBar: true,
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            win.webContents.setWindowOpenHandler(({ url }) => {
              if (url.startsWith("http://127.0.0.1:")) {
                return { action: "allow" };
              }
              shell.openExternal(url);
              return { action: "deny" };
            });

            await win.loadURL(localUrl);
          }

          const gotLock = app.requestSingleInstanceLock();

          if (!gotLock) {
            app.quit();
          } else {
            app.whenReady().then(createWindow);

            app.on("activate", () => {
              if (BrowserWindow.getAllWindows().length === 0) createWindow();
            });

            app.on("window-all-closed", () => {
              if (process.platform !== "darwin") app.quit();
            });

            app.on("before-quit", () => {
              if (server) server.close();
            });
          }
          '@ | Set-Content -Path windows-build\main.js -Encoding UTF8

      - name: Instalar dependencias
        working-directory: windows-build
        shell: pwsh
        run: npm install

      - name: Crear instalador EXE
        working-directory: windows-build
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Publicar en GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-build-${{ github.run_number }}"
          $asset = "windows-build\dist\VICBANGFIT-Windows-Setup.exe"

          gh release create $tag $asset `
            --title "VICBANGFIT Windows" `
            --notes "Instalador de VICBANGFIT para Windows generado automáticamente desde la versión actual de la carpeta web." `
            --latest
