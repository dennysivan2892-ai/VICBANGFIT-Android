name: Exercise guide checks
on:
  pull_request:
    paths:
      - 'web/**'
      - 'tests/exercise-guides*'
      - 'tests/nutrition-*'
      - 'tests/client-my-day*'
      - 'tests/training-levels*'
      - 'tests/shared-routines*'
      - 'tests/nutrition-supplements*'
      - 'package*.json'
      - '.github/workflows/exercise-guides-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guide-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tests/exercise-guides.unit.cjs
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node tests/exercise-guides.test.cjs
      - run: node tests/nutrition-adjustments.test.cjs
      - run: node tests/client-my-day.test.cjs
      - run: node tests/nutrition-supplements.test.cjs
      - run: node tests/trainer-proposals.test.cjs
      - run: node tests/training-levels.test.cjs
      - run: node tests/shared-routines-ui.test.cjs
      - run: node tests/nutrition-existing-plan.test.cjs
      - run: node tests/nutrition-save-performance.test.cjs
      - run: node tests/nutrition-current-adjustment.test.cjs
