# Lanzamiento TestFlight: corrección de visibilidad y caché de la burbuja de mensajes
name: Subir VICBANGFIT a TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-vicbangfit-ios-testflight.yml"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      - name: Construir web
        run: npm run build

      - name: Crear y sincronizar proyecto iOS
        shell: bash
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Instalar certificado y perfil de Apple
        shell: bash
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/VICBANGFIT_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/VICBANGFIT.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/VICBANGFIT-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo -n "$IOS_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Perfil instalado: $PROFILE_UUID"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Mostrar versión de Xcode
        run: xcodebuild -version

      - name: Crear archivo firmado
        shell: bash
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/VICBANGFIT.xcarchive" \
            DEVELOPMENT_TEAM=YT38N6PCWF \
            PRODUCT_BUNDLE_IDENTIFIER=com.vicbangfit.app \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="VICBANGFIT-AppStore" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="1.0.0" \
            archive

      - name: Crear IPA para App Store Connect
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>YT38N6PCWF</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.vicbangfit.app</key>
              <string>VICBANGFIT-AppStore</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          mkdir -p "$GITHUB_WORKSPACE/ios-output"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/VICBANGFIT.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/ios-output" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          ls -lah "$GITHUB_WORKSPACE/ios-output"

      - name: Subir IPA a TestFlight
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8_BASE64: ${{ secrets.APPSTORE_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          echo -n "$APPSTORE_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          IPA_PATH="$(find "$GITHUB_WORKSPACE/ios-output" -maxdepth 1 -name '*.ipa' -type f | head -1)"
          if [ -z "$IPA_PATH" ]; then
            echo "No se encontró ningún archivo IPA"
            exit 1
          fi

          echo "Subiendo $(basename "$IPA_PATH") a App Store Connect/TestFlight..."
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

